<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Livia IA - Assistente 3D</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Three.js -->
    <script src="https://cloudflare.com"></script>
    <!-- GSAP -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(13, 20, 33, 0.95);
            --panel-border: rgba(0, 150, 255, 0.4);
            --accent-blue: #007bff;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #8ba0b8;
            --danger: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05070a;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        /* Canvas 3D */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Botão Flutuante do Menu */
        .menu-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .menu-toggle.active {
            background: rgba(255, 71, 87, 0.8);
        }

        /* Painel Deslizante */
        .side-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--panel-border);
            z-index: 90;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .side-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .panel-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Área de Histórico do Chat */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-history::-webkit-scrollbar { width: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            background: var(--accent-blue);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg.bot {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Cartão de Controles */
        .info-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .info-card h4 {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .grid-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .grid-btn.active {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* Container de Entrada do Chat */
        .chat-input-container {
            position: relative;
            padding-top: 5px;
            flex-shrink: 0;
        }

        .chat-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 45px 12px 12px;
            color: white;
            font-size: 0.8rem;
            outline: none;
        }

        .chat-send {
            position: absolute;
            right: 12px;
            top: calc(50% + 2.5px);
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent-cyan);
            cursor: pointer;
            font-size: 1rem;
        }

        /* Aviso Flutuante */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hint" id="hint">
        <i class="fas fa-comments" style="color: var(--accent-cyan);"></i> Abra o menu para conversar com a Livia em tempo real
    </div>

    <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2><i class="fas fa-robot" style="color: var(--accent-cyan);"></i> Livia IA</h2>
            <button class="close-btn" id="close-btn"><i class="fas fa-times"></i></button>
        </div>

        <!-- Linha do Histórico da Conversa -->
        <div class="chat-history" id="chat-history">
            <div class="msg bot">Olá! Sou a Livia. Como posso te ajudar hoje? Arraste ou use as ações abaixo para interagir comigo!</div>
        </div>

        <!-- Estado de Movimento -->
        <div class="info-card">
            <h4><i class="fas fa-running"></i> Controle de Movimentos</h4>
            <div class="btn-grid">
                <button class="grid-btn" id="btn-walk"><i class="fas fa-walking fa-lg"></i>Andar</button>
                <button class="grid-btn" id="btn-crouch"><i class="fas fa-chair fa-lg"></i>Agachar</button>
            </div>
        </div>

        <!-- Campo de Input -->
        <div class="chat-input-container">
            <input type="text" id="chat-input" class="chat-input" placeholder="Digite uma mensagem para Livia...">
            <button id="chat-send" class="chat-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

<script>
// --- CONFIGURAÇÃO DO CENÁRIO THREE.JS ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#05070a');

const grid = new THREE.GridHelper(20, 20, 0x00d4ff, 0x112233);
grid.position.y = -2;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// ILUMINAÇÃO ESTÚDIO (Garante renderização visível e bonita)
const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambientLight);

Use o código com cuidado.const dirLight1 = new THREE.DirectionalLight(0xffedf2, 0.8);dirLight1.position.set(5, 10, 7);scene.add(dirLight1);const dirLight2 = new THREE.DirectionalLight(0x00d4ff, 0.45);dirLight2.position.set(-5, 2, -1);scene.add(dirLight2);// --- CONSTRUÇÃO DO PERSONAGEM BASEADO NA IMAGEM (RUIVA) ---const materialPele = new THREE.MeshStandardMaterial({color: 0xfbd6c6, // Tom de pele claro correspondente à imagem de referênciaroughness: 0.4,metalness: 0.05});const grupoPersonagem = new THREE.Group();grupoPersonagem.position.y = -0.5;scene.add(grupoPersonagem);// Articulações estruturaisconst noduloCabeca = new THREE.Group();const noduloBusto = new THREE.Group();const noduloCintura = new THREE.Group();const noduloQuadril = new THREE.Group();const noduloPernaEsq = new THREE.Group();const noduloPernaDir = new THREE.Group();noduloPernaEsq.position.set(-0.22, -0.4, 0);noduloPernaDir.position.set(0.22, -0.4, 0);// 1. Cabeça (Formato Oval Suave)const geoCabeca = new THREE.SphereGeometry(0.24, 32, 32);geoCabeca.scale(1, 1.18, 1);const malhaCabeca = new THREE.Mesh(geoCabeca, materialPele);noduloCabeca.add(malhaCabeca);noduloCabeca.position.y = 1.32;// 2. Busto e Ombros Proporcionais à Referência Sentada/Frenteconst geoBusto = new THREE.CylinderGeometry(0.28, 0.22, 0.35, 32);const malhaBusto = new THREE.Mesh(geoBusto, materialPele);noduloBusto.add(malhaBusto);const geoSeio = new THREE.SphereGeometry(0.10, 16, 16);const seioEsq = new THREE.Mesh(geoSeio, materialPele);seioEsq.position.set(-0.11, 0.04, 0.18);const seioDir = seioEsq.clone();seioDir.position.x = 0.11;noduloBusto.add(seioEsq, seioDir);noduloBusto.position.y = 0.95;// 3. Cintura Natural Finaconst geoCintura = new THREE.CylinderGeometry(0.20, 0.23, 0.3, 32);const malhaCintura = new THREE.Mesh(geoCintura, materialPele);noduloCintura.add(malhaCintura);noduloCintura.position.y = 0.65;// 4. Quadril Alinhado com as Proporções Anatômicas da Imagemconst geoQuadril = new THREE.SphereGeometry(0.32, 32, 16);geoQuadril.scale(1, 0.85, 1);const malhaQuadril = new THREE.Mesh(geoQuadril, materialPele);noduloQuadril.add(malhaQuadril);noduloQuadril.position.y = 0.35;// 5. Pernasconst geoPerna = new THREE.CylinderGeometry(0.11, 0.07, 1.3, 16);const malhaPernaEsq = new THREE.Mesh(geoPerna, materialPele);malhaPernaEsq.position.y = -0.65;noduloPernaEsq.add(malhaPernaEsq);const malhaPernaDir = malhaPernaEsq.clone();noduloPernaDir.add(malhaPernaDir);// Acoplamento hierárquico completogrupoPersonagem.add(noduloCabeca);grupoPersonagem.add(noduloBusto);grupoPersonagem.add(noduloCintura);grupoPersonagem.add(noduloQuadril);grupoPersonagem.add(noduloPernaEsq);grupoPersonagem.add(noduloPernaDir);// --- MODELAGEM DO CABELO RUIVO COM FRANJA E RABO DE CAVALO (FIO A FIO) ---const materialCabelo = new THREE.MeshStandardMaterial({color: 0xb13c19, // Ruivo acobreado quente idêntico à imagem enviadaroughness: 0.3,side: THREE.DoubleSide});function criarFioCurvo(origemX, origemY, origemZ, curvaX, comprimentoY, curvaZ, espessura = 0.015) {const pontos = [new THREE.Vector3(origemX, origemY, origemZ),new THREE.Vector3(origemX + curvaX * 0.5, origemY - comprimentoY * 0.3, origemZ + curvaZ * 0.5),new THREE.Vector3(origemX + curvaX, origemY - comprimentoY, origemZ + curvaZ)];const curva = new THREE.CatmullRomCurve3(pontos);const geoFio = new THREE.TubeGeometry(curva, 8, espessura, 6, false);return new THREE.Mesh(geoFio, materialCabelo);}// 1. Franja Frontal da Personagem (Respeitando os olhos e contorno do rosto)for (let i = 0; i < 15; i++) {let pct = (i / 14) * 0.4 - 0.2; // Distribuição na testalet fx = pct;let fy = 1.48;let fz = 0.22;const fioFranja = criarFioCurvo(fx, fy, fz, pct * 0.2, 0.16, 0.04, 0.012);noduloCabeca.add(fioFranja);}// 2. Cobertura da Base do Cabelo (Mechas laterais e traseiras)const totalFiosBase = 40;for (let i = 0; i < totalFiosBase; i++) {let angulo = (i / totalFiosBase) * Math.PI * 1.4 + Math.PI * 0.8;let fx = Math.cos(angulo) * 0.25;let fz = Math.sin(angulo) * 0.25;let fy = 1.46;if (Math.abs(angulo - Math.PI * 1.5) > 0.35) { // Abre espaço para a face limpaconst fioBase = criarFioCurvo(fx, fy, fz, fx * 0.4, 0.4, fz * 0.3);noduloCabeca.add(fioBase);}}// 3. Rabo de Cavalo Alto Volumoso (Parte Traseira Superior da Imagem)const noduloRaboCavalo = new THREE.Group();noduloRaboCavalo.position.set(0, 1.46, -0.22);noduloCabeca.add(noduloRaboCavalo);for (let i = 0; i < 25; i++) {let anguloRnd = Math.random() * Math.PI * 2;let espalharX = Math.cos(anguloRnd) * 0.08;let espalharZ = Math.sin(anguloRnd) * 0.06 - 0.15; // Caimento para trásconst fioRabo = criarFioCurvo(0, 0, 0, espalharX, 0.5 + Math.random() * 0.2, espalharZ, 0.016);noduloRaboCavalo.add(fioRabo);}// --- INTERFACE LATERAL E SISTEMA DE CHAT EM TEMPO REAL ---const sidePanel = document.getElementById('side-panel');const menuToggle = document.getElementById('menu-toggle');const closeBtn = document.getElementById('close-btn');const chatHistory = document.getElementById('chat-history');const chatInput = document.getElementById('chat-input');const chatSend = document.getElementById('chat-send');// Gatilhos do Menu LateralmenuToggle.addEventListener('click', () => {sidePanel.classList.toggle('open');menuToggle.classList.toggle('active');menuToggle.innerHTML = sidePanel.classList.contains('open') ? '' : '';});closeBtn.addEventListener('click', () => {sidePanel.classList.remove('open');menuToggle.classList.remove('active');menuToggle.innerHTML = '';});// Lógica de Envio e Resposta Assíncrona do Chatfunction enviarMensagem() {const texto = chatInput.value.trim();if (!texto) return;// 1. Adicionar Mensagem do Usuário na Telaconst msgUser = document.createElement('div');msgUser.className = 'msg user';msgUser.innerText = texto;chatHistory.appendChild(msgUser);chatInput.value = '';chatHistory.scrollTop = chatHistory.scrollHeight;// 2. Resposta Automatizada da Livia IA simulada em Tempo RealsetTimeout(() => {const msgBot = document.createElement('div');msgBot.className = 'msg bot';let resposta = "Entendi! Estou processando seu comando e atualizando os parâmetros da aplicação.";// Comparações simples de texto para interatividade diretaconst textoMinusculo = texto.toLowerCase();if (textoMinusculo.includes('andar') || textoMinusculo.includes('caminhar')) {resposta = "Comando aceito! Iniciando animação de caminhada na passarela.";ativarEstado('andando');} else if (textoMinusculo.includes('agachar') || textoMinusculo.includes('sentar')) {resposta = "Entendido, alterando postura física para agachamento.";ativarEstado('agachado');} else if (textoMinusculo.includes('parar') || textoMinusculo.includes('fique de pe')) {resposta = "Parando movimentos. Retornando à postura estática padrão.";ativarEstado('parado');} else if (textoMinusculo.includes('olá') || textoMinusculo.includes('oi')) {resposta = "Olá! Como está ficando o meu novo visual ruivo baseado no modelo que você enviou?";}msgBot.innerText = resposta;chatHistory.appendChild(msgBot);chatHistory.scrollTop = chatHistory.scrollHeight;}, 750);}chatSend.addEventListener('click', enviarMensagem);chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensagem(); });// --- ESTADOS DE ANIMAÇÃO CORPORAL ---let estadoMovimento = 'parado';let tempo = 0;const btnWalk = document.getElementById('btn-walk');const btnCrouch = document.getElementById('btn-crouch');function activarVisualBotao(estado) {btnWalk.classList.remove('active');btnCrouch.classList.remove('active');if (estado === 'andando') btnWalk.classList.add('active');if (estado === 'agachado') btnCrouch.classList.add('active');}function activarEstado(estado) {if (estadoMovimento === estado) {estadoMovimento = 'parado';} else {estadoMovimento = estado;}activarVisualBotao(estadoMovimento);}btnWalk.addEventListener('click', () => activarEstado('andando'));btnCrouch.addEventListener('click', () => activarEstado('agachado'));// --- CICLO DE RENDERIZAÇÃO REALISTA ---function renderizar() {requestAnimationFrame(renderizar);tempo += 0.05;// Rotação contínua e suave para visualização 3D completa da personagemgrupoPersonagem.rotation.y = Math.sin(tempo * 0.1) * 0.25;// Física de balanço leve e natural para o rabo de cavalo traseironoduloRaboCavalo.rotation.z = Math.sin(tempo * 0.4) * 0.03;noduloRaboCavalo.rotation.x = Math.cos(tempo * 0.2) * 0.02;if (estadoMovimento === 'andando') {// Movimentação alternada coordenada das pernasnoduloPernaEsq.rotation.x = Math.sin(tempo * 2.5) * 0.45;noduloPernaDir.rotation.x = -Math.sin(tempo * 2.5) * 0.45;noduloQuadril.rotation.z = Math.sin(tempo * 2.5) * 0.06;// Pequena variação vertical de altura devido ao impacto dos passosgrupoPersonagem.position.y = -0.5 + Math.abs(Math.sin(tempo * 5)) * 0.03;}else if (estadoMovimento === 'agachado') {noduloPernaEsq.rotation.x = -0.85;noduloPernaDir.rotation.x = -0.85;grupoPersonagem.position.y = -0.92;}else {// Amortecimento suave para o estado de repouso padrãonoduloPernaEsq.rotation.x *= 0.85;noduloPernaDir.rotation.x *= 0.85;noduloQuadril.rotation.z *= 0.85;grupoPersonagem.position.y = -0.5;}renderer.render(scene, camera);}// Suporte a redimensionamento de janelawindow.addEventListener('resize', () => {camera.aspect = window.innerWidth / window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth, window.innerHeight);});renderizar();
