<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silhueta Artística Feminina</title>
    <style>
        :root {
            --pele-base: #e0a96d;
            --pele-sombra: #b87d4b;
            --cabelo: #2b1d0c; /* Tom castanho escuro/iluminado */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5eae0;
            margin: 0;
            font-family: sans-serif;
        }

        /* Contêiner vertical para alinhar o corpo dos cabelos aos pés */
        .corpo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 300px;
            height: 750px;
        }

        /* 1. Cabelos e Cabeça */
        .cabelo-longo {
            position: absolute;
            top: 10px;
            width: 110px;
            height: 260px;
            background: var(--cabelo);
            border-radius: 50% 50% 20% 20% / 40% 40% 60% 60%;
            z-index: 1;
        }

        .cabeca {
            position: relative;
            top: 25px;
            width: 55px;
            height: 70px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 50% 50% 45% 45%;
            z-index: 2;
        }

        /* 2. Tronco e Busto */
        .pescoco {
            width: 16px;
            height: 25px;
            background: var(--pele-sombra);
            margin-top: 15px;
            z-index: 2;
        }

        .ombros-e-busto {
            display: flex;
            justify-content: center;
            position: relative;
            width: 120px;
            height: 80px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 40% 40% 30% 30% / 20% 20% 80% 80%;
            margin-top: -5px;
            z-index: 2;
        }

        /* 3. Cintura Escultural (Linha de violão) */
        .cintura {
            width: 65px;
            height: 60px;
            background: linear-gradient(to bottom, var(--pele-sombra), var(--pele-base));
            border-radius: 10% 10% 40% 40% / 10% 10% 90% 90%;
            z-index: 2;
        }

        /* 4. Quadril e Glúteos (Volume acentuado) */
        .quadril-container {
            display: flex;
            width: 145px;
            height: 110px;
            margin-top: -5px;
            z-index: 2;
        }

        .quadril-lado {
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, var(--pele-base) 0%, var(--pele-sombra) 100%);
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.15);
        }

        .q-esquerdo {
            border-radius: 80% 20% 30% 70% / 60% 20% 80% 40%;
        }

        .q-direito {
            border-radius: 20% 80% 70% 30% / 20% 60% 40% 80%;
        }

        /* 5. Pernas e Pés (Longas e torneadas) */
        .pernas-container {
            display: flex;
            justify-content: space-between;
            width: 110px;
            height: 340px;
            margin-top: -10px;
            z-index: 1;
        }

        .perna {
            width: 46px;
            height: 100%;
            background: linear-gradient(to bottom, var(--pele-sombra), var(--pele-base) 70%, var(--pele-sombra));
            border-radius: 30% 30% 20% 20% / 10% 10% 90% 90%;
        }

        .pes {
            display: flex;
            justify-content: space-between;
            width: 115px;
            height: 15px;
            margin-top: -2px;
        }

        .pe {
            width: 42px;
            height: 100%;
            background: var(--pele-sombra);
            border-radius: 0 80% 20% 20% / 0 70% 30% 30%;
        }
    </style>
</head>
<body>

    <!-- Estrutura em árvore representando a anatomia e proporções do design -->
    <div class="corpo-container" aria-label="Modelagem geométrica de silhueta corporal">
        
        <!-- Topo: Cabelo e Cabeça -->
        <div class="cabelo-longo"></div>
        <div class="cabeca"></div>
        <div class="pescoco"></div>

        <!-- Superior: Ombros e Linha do Tronco -->
        <div class="ombros-e-busto"></div>
        
        <!-- Centro: Curvatura da Cintura -->
        <div class="cintura"></div>

        <!-- Inferior: Proporções do Quadril -->
        <div class="quadril-container">
            <div class="quadril-lado q-esquerdo"></div>
            <div class="quadril-lado q-direito"></div>
        </div>

        <!-- Base: Membros Inferiores e Extremedidades -->
        <div class="pernas-container">
            <div class="perna p-esquerda"></div>
            <div class="perna p-direita"></div>
        </div>
        
        <div class="pes">
            <div class="pe"></div>
            <div class="pe"></div>
        </div>

    </div>

</body>
</html>
