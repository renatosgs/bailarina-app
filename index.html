<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação de Transição Corporal e Caminhada</title>
    <style>
        :root {
            /* Paleta com tons de pele humana (Luz, Base e Sombra) para volume */
            --pele-luz: #fce5cd;
            --pele-base: #f1c232; /* Tom base dourado/quente */
            --pele-corpo: #e6b8af; /* Tom rosado natural */
            --pele-sombra: #c27ba0; /* Sombra pélvica/glútea */
            --cabelo: #271c19;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0b0d;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Cenário de visualização */
        .palco-animacao {
            position: relative;
            width: 800px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --------------------------------------------------
           CONJUNTO CORPORAL PRINCIPAL
           Controla a transição de postura (De quatro -> Em pé)
           -------------------------------------------------- */
        .estrutura-corporal {
            position: relative;
            width: 200px;
            height: 400px;
            transform-style: preserve-3d;
            animation: mudancaPostura 12s ease-in-out infinite alternate;
        }

        @keyframes mudancaPostura {
            /* 0% a 30%: Pose horizontalizada de costas/perspectiva baixa */
            0%, 30% {
                transform: translateY(100px) rotateX(60deg) rotateY(180deg);
            }
            /* 35% a 60%: Transição levantando o tronco */
            55%, 60% {
                transform: translateY(0px) rotateX(0deg) rotateY(180deg);
            }
            /* 65% a 100%: Em pé, girando de perfil e iniciando caminhada */
            75%, 100% {
                transform: translateY(-20px) rotateX(0deg) rotateY(90deg);
            }
        }

        /* --------------------------------------------------
           ESTILIZAÇÃO DOS SEGMENTOS ANATÔMICOS
           -------------------------------------------------- */
        
        /* Quadril e Glúteos (Foco inicial da perspectiva) */
        .quadril-gluteos {
            position: absolute;
            top: 120px;
            left: 25px;
            width: 150px;
            height: 130px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .gluteo-membro {
            width: 72px;
            height: 120px;
            background: linear-gradient(135deg, var(--pele-luz), var(--pele-corpo), var(--pele-sombra));
            box-shadow: inset -4px -8px 20px rgba(0,0,0,0.3);
        }
        .g-esq { border-radius: 70% 30% 40% 75%; }
        .g-dir { border-radius: 30% 70% 75% 40%; }

        /* Tronco e Linha da Cintura */
        .tronco-superior {
            position: absolute;
            top: 20px;
            left: 40px;
            width: 120px;
            height: 110px;
            background: linear-gradient(to bottom, var(--pele-luz), var(--pele-corpo));
            border-radius: 40% 40% 30% 30% / 20% 20% 80% 80%;
            z-index: 4;
            transform-origin: bottom center;
            animation: extensaoTronco 12s ease-in-out infinite alternate;
        }

        @keyframes extensaoTronco {
            0%, 30% { transform: rotateX(-70deg) translateY(-30px); }
            55%, 100% { transform: rotateX(0deg) translateY(0px); }
        }

        .umbigo {
            position: absolute;
            bottom: -15px;
            left: 57px;
            width: 6px;
            height: 8px;
            background: var(--pele-sombra);
            border-radius: 50%;
            opacity: 0.7;
        }

        /* Membros Inferiores (Coxas e Pernas) */
        .pernas-container {
            position: absolute;
            top: 240px;
            left: 30px;
            width: 140px;
            height: 200px;
            display: flex;
            justify-content: space-between;
        }

        .perna-articulada {
            width: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform-origin: top center;
        }

        /* Animação sincronizada para simular passos quando estiver em pé */
        .p-esquerda { animation: passoEsq 12s ease-in-out infinite alternate; }
        .p-direita { animation: passoDir 12s ease-in-out infinite alternate; }

        @keyframes passoEsq {
            0%, 65% { transform: rotateX(0deg); }
            75% { transform: rotateX(25deg); }
            87% { transform: rotateX(-20deg); }
            100% { transform: rotateX(20deg); }
        }

        @keyframes passoDir {
            0%, 65% { transform: rotateX(0deg); }
            75% { transform: rotateX(-25deg); }
            87% { transform: rotateX(20deg); }
            100% { transform: rotateX(-20deg); }
        }

        .coxa-grossa {
            width: 100%;
            height: 110px;
            background: linear-gradient(to bottom, var(--pele-corpo), var(--pele-sombra));
            border-radius: 50% 50% 40% 40% / 30% 30% 70% 70%;
        }

        .panturrilha-pe {
            width: 75%;
            height: 90px;
            background: linear-gradient(to bottom, var(--pele-sombra), var(--pele-corpo));
            margin: -5px auto 0 auto;
            border-radius: 20% 20% 40% 40%;
        }

        /* Cabeça e Cabelos Longos */
        .cabeca-cabelo-bloco {
            position: absolute;
            top: -75px;
            left: 70px;
            width: 60px;
            height: 75px;
            z-index: 6;
        }

        .rosto-base {
            width: 55px;
            height: 70px;
            background: var(--pele-luz);
            border-radius: 50% 50% 45% 45%;
        }

        .cabelo-balanco {
            position: absolute;
            top: -5px;
            left: -10px;
            width: 75px;
            height: 220px;
            background: linear-gradient(to bottom, var(--cabelo), #110907);
            border-radius: 40% 40% 20% 20% / 20% 20% 80% 80%;
            z-index: -1;
            transform-origin: top center;
            animation: movimentoCabelo 3s ease-in-out infinite alternate;
        }

        @keyframes movimentoCabelo {
            0% { transform: rotate(-3deg) skewX(-2deg); }
            100% { transform: rotate(3deg) skewX(2deg); }
        }
    </style>
</head>
<body>

    <div class="palco-animacao">
        
        <!-- Estrutura Tridimensional Dinâmica -->
        <div class="estrutura-corporal" aria-label="Modelo de transição postural anatômica">
            
            <!-- Parte Superior: Cabeça e Cabelo com Física de Balanço -->
            <div class="cabeca-cabelo-bloco">
                <div class="rosto-base"></div>
                <div class="cabelo-balanco"></div>
            </div>

            <!-- Centro: Linha do Tronco e Detalhe Abdominal -->
            <div class="tronco-superior">
                <div class="umbigo"></div>
            </div>

            <!-- Foco da Perspectiva Traseira: Quadril de Proporções Curvilíneas -->
            <div class="quadril-gluteos">
                <div class="gluteo-membro g-esq"></div>
                <div class="gluteo-membro g-dir"></div>
            </div>

            <!-- Membros Inferiores com Eixos de Rotação Intercalados -->
            <div class="pernas-container">
                <!-- Perna Esquerda -->
                <div class="perna-articulada p-esquerda">
                    <div class="coxa-grossa"></div>
                    <div class="panturrilha-pe"></div>
                </div>
                <!-- Perna Direita -->
                <div class="perna-articulada p-direita">
                    <div class="coxa-grossa"></div>
                    <div class="panturrilha-pe"></div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
