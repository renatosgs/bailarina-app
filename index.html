<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boneca Robô 3D - Vestir e Despir</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #1a0a2e 0%, #08080a 70%);
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }

    #hud {
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(5,5,10,0.85); padding: 10px 22px; border-radius: 30px;
        border: 1px solid #ff44aa; z-index: 10; pointer-events: none;
        box-shadow: 0 0 20px rgba(255,68,170,0.4);
    }
    #hud h1 { font-size: 0.95em; color: #ff44aa; letter-spacing: 2px; text-transform: uppercase; }
    #hud p  { font-size: 0.7em; color: #aaa; text-align: center; margin-top: 2px; }

    /* Painel inferior de botões */
    #bottom-bar {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 12px; z-index: 100;
        background: rgba(15,15,25,0.9); padding: 10px 15px; border-radius: 50px;
        border: 1px solid rgba(255,68,170,0.4);
        box-shadow: 0 0 25px rgba(255,68,170,0.3);
        backdrop-filter: blur(10px);
    }
    .ctrl-btn {
        padding: 12px 22px; border: none; border-radius: 40px;
        font-weight: bold; font-size: 0.85em; cursor: pointer;
        transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        color: #000;
    }
    #btn-dress   { background: linear-gradient(135deg, #ff44aa, #ff0088); color: #fff; }
    #btn-undress { background: linear-gradient(135deg, #00ffff, #0088ff); color: #000; }
    #btn-pose    { background: linear-gradient(135deg, #ffcc00, #ff8800); color: #000; }
    .ctrl-btn:hover  { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,68,170,0.5); }
    .ctrl-btn:active { transform: scale(0.95); }

    #outfit-info {
        position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px;
        font-size: 0.75em; color: #fff; border: 1px solid rgba(255,68,170,0.4);
        z-index: 10; pointer-events: none;
    }
</style>
</head>
<body>

<div id="viewport"></div>

<div id="hud">
    <h1>💕 Boneca Robô 3D 💕</h1>
    <p>Arraste para girar • Role para dar zoom</p>
</div>

<div id="outfit-info">Estado: <b id="state-txt" style="color:#ff44aa">VESTIDA</b></div>

<div id="bottom-bar">
    <button class="ctrl-btn" id="btn-dress"   onclick="dressUp()">👗 Vestir</button>
    <button class="ctrl-btn" id="btn-undress" onclick="undress()">👙 Despir</button>
    <button class="ctrl-btn" id="btn-pose"    onclick="changePose()">💃 Pose</button>
</div>

<script>

let poseIndex   = 0;
let rotationY   = 0;
let targetScale = 1;

const clockRef = new THREE.Clock();

    eye:       new THREE.MeshBasicMaterial({ color: 0x00ffff }),
    lips:      new THREE.MeshStandardMaterial({ color: 0xff3377, roughness: 0.3, metalness: 0.2 }),
    dress:     new THREE.MeshStandardMaterial({ color: 0xff44aa, roughness: 0.5, metalness: 0.3, transparent: true, opacity: 1 }),

    heel:      new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.2, metalness: 0.9 })

/* ---------- CONSTRUÇÃO ---------- */

    armR = new THREE.Group();

    upperArmR.position.y = -0.12;

    const foreArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.22, 16), MAT.skin);
    foreArmR.position.y = -0.35;

    const handR = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), MAT.skin);

    handR.scale.set(0.7, 1, 0.5);
    armR.add(handR);

    // Perna Esquerda
    legL = new THREE.Group();
    legL.position.set(-0.13, -0.5, 0);

    const thighL = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.075, 0.42, 20), MAT.skin);
    thighL.position.y = -0.21;
    legL.add(thighL);

    const calfL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.045, 0.40, 18), MAT.skin);
    calfL.position.y = -0.60;
    legL.add(calfL);

    // Sapato de salto esquerdo
    const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.05, 0.18), MAT.heel);
    shoeL.position.set(0, -0.83, 0.04);
    legL.add(shoeL);
    const heelL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.09, 0.02), MAT.heel);
    heelL.position.set(0, -0.87, -0.04);
    legL.add(heelL);

    // Perna Direita
    legR = new THREE.Group();
    legR.position.set(0.13, -0.5, 0);
    doll.add(legR);

    const thighR = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.075, 0.42, 20), MAT.skin);
    thighR.position.y = -0.21;
    legR.add(thighR);

    calfR.position.y = -0.60;
    legR.add(calfR);

    shoeR.position.set(0, -0.83, 0.04);
    legR.add(shoeR);
    const heelR = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.09, 0.02), MAT.heel);

    const dressTop = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.22, 0.32, 32, 1, true), MAT.dress);
    dressTop.position.y = 0.32;
    outfitParts.push(dressTop);
    doll.add(dressTop);

    // Saia (cônica, cobre quadril e coxas)
    const dressSkirt = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.42, 0.55, 32, 1, true), MAT.dressDark);
    dressSkirt.position.y = -0.15;

    // Detalhe cinto
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.20, 0.015, 8, 32), MAT.dress);

    /* ===== CONSTRUÇÃO DA LINGERIE (top + calcinha) ===== */
    // Top (sutiã)
    const braL = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), MAT.lingerie);
    braL.position.set(-0.11, 0.40, 0.10);
    braL.rotation.x = Math.PI * 0.5;
    underParts.push(braL);
    doll.add(braL);

    const braR = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), MAT.lingerie);
    braR.position.set(0.11, 0.40, 0.10);
    braR.rotation.x = Math.PI * 0.5;

    doll.add(strapR);

    scene.add(doll);
}

/* ---------- VESTIR / DESPIR ---------- */
function dressUp() {
    isDressed = true;
    outfitParts.forEach(p => p.visible = true);
    underParts.forEach(p => p.visible = false);
    document.getElementById('state-txt').innerText = 'VESTIDA';
    document.getElementById('state-txt').style.color = '#ff44aa';
    document.getElementById('btn-dress').classList.add('active');
}

function undress() {
    isDressed = false;
    outfitParts.forEach(p => p.visible = false);
    underParts.forEach(p => p.visible = true);
    document.getElementById('state-txt').innerText = 'LINGERIE';
    document.getElementById('state-txt').style.color = '#00ffff';
    document.getElementById('btn-undress').classList.add('active');
}

/* ---------- POSES ---------- */
function changePose() {
    poseIndex = (poseIndex + 1) % 4;
    if (poseIndex === 0) {          // Pose normal
        armL.rotation.z = 0.1;
        armR.rotation.z = -0.1;
        legL.rotation.z = 0.02;
        legR.rotation.z = -0.02;
        doll.rotation.z = 0;
    } else if (poseIndex === 1) {   // Mãos na cintura
        armL.rotation.z = 0.7;
        armL.rotation.x = -0.6;
        armR.rotation.z = -0.7;
        armR.rotation.x = -0.6;
    } else if (poseIndex === 2) {   // Perna cruzada
        legL.rotation.z = 0.15;
        legL.rotation.y = 0.2;
        legR.rotation.z = -0.02;
        doll.rotation.z = 0.05;
    } else {                        // Pose sensual
        armL.rotation.z = 0.3;
        armL.rotation.x = 0.4;
        armR.rotation.z = -0.3;
        armR.rotation.x = -0.3;
        doll.rotation.z = -0.08;
    }
}

/* ---------- INICIALIZAÇÃO 3D ---------- */
function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x08080a, 3, 8);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 2.4);
    camera.lookAt(0, 0.1, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('viewport').appendChild(renderer.domElement);

    /* ---- ILUMINAÇÃO ---- */
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // Luz principal (rosa)
    const keyLight = new THREE.DirectionalLight(0xff88cc, 1.0);
    keyLight.position.set(2, 3, 3);
    scene.add(keyLight);

    // Luz de preenchimento (ciano)
    const fillLight = new THREE.DirectionalLight(0x00ffff, 0.6);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);

    // Luz de fundo (magenta)
    const backLight = new THREE.PointLight(0xff00aa, 1.2, 10);
    backLight.position.set(0, 1, -2.5);
    scene.add(backLight);

    // Luz de topo (branca)
    const topLight = new THREE.SpotLight(0xffffff, 0.8);
    topLight.position.set(0, 4, 0);
    topLight.angle = 0.6;
    topLight.penumbra = 0.5;
    scene.add(topLight);

    /* ---- CHÃO REFLEXIVO ---- */
    const floorGeo = new THREE.CircleGeometry(2, 64);
    const floorMat = new THREE.MeshStandardMaterial({
        color: 0x1a0a2e, roughness: 0.2, metalness: 0.9,
        transparent: true, opacity: 0.7
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.4;
    scene.add(floor);

    // Anel brilhante no chão
    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.0, 0.008, 8, 64),
        new THREE.MeshBasicMaterial({ color: 0xff44aa })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -1.39;
    scene.add(ring);

    buildDoll();
    doll.position.y = 0.55;   // eleva a boneca
    dressUp();

    // Estrelas/partículas de fundo
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 200;
    const positions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
        positions[i]     = (Math.random() - 0.5) * 20;
        positions[i + 1] = (Math.random() - 0.5) * 20;
        positions[i + 2] = -3 - Math.random() * 10;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xff88cc, size: 0.04, transparent: true, opacity: 0.8 });
    scene.add(new THREE.Points(starsGeo, starsMat));

    clock = new THREE.Clock();
    animate();
}

/* ---------- LOOP DE ANIMAÇÃO ---------- */
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Rotação suave automática quando não há interação
    if (!isDragging) {
        doll.rotation.y += 0.004;
    } else {
        doll.rotation.y = rotationY;
    }

    // Respiração suave (efeito orgânico)
    const breath = Math.sin(t * 1.5) * 0.008;
    if (chestL && chestR) {
        chestL.position.y = 0.38 + breath;
        chestR.position.y = 0.38 + breath;
        chestL.scale.set(1 + breath, 1 + breath, 0.95);
        chestR.scale.set(1 + breath, 1 + breath, 0.95);
    }
    if (head) {
        head.rotation.z = Math.sin(t * 0.7) * 0.02;
        head.rotation.y = Math.sin(t * 0.5) * 0.05;
    }

    // Balanço sutil do corpo
    doll.position.y = 0.55 + Math.sin(t * 1.2) * 0.01;

    renderer.render(scene, camera);
}

/* ---------- INTERAÇÃO (arrastar / zoom) ---------- */
let isDragging = false;
let prevX = 0;
let prevY = 0;

const el = document.getElementById('viewport');

el.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
el.addEventListener('touchstart', e => {
    isDragging = true;
    prevX = e.touches[0].clientX;
    prevY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    rotationY += (e.clientX - prevX) * 0.01;
    doll.rotation.y = rotationY;
    prevX = e.clientX;
});

window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    rotationY += (e.touches[0].clientX - prevX) * 0.01;
    doll.rotation.y = rotationY;
    prevX = e.touches[0].clientX;
}, { passive: true });

window.addEventListener('mouseup',  () => isDragging = false);
window.addEventListener('touchend', () => isDragging = false);

// Zoom com scroll
el.addEventListener('wheel', e => {
    e.preventDefault();
    camera.position.z += e.deltaY * 0.002;
    camera.position.z = Math.max(1.2, Math.min(4.5, camera.position.z));
}, { passive: false });

// Pinch zoom
let pinchDist = 0;
el.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (pinchDist > 0) {
            camera.position.z += (pinchDist - dist) * 0.005;
            camera.position.z = Math.max(1.2, Math.min(4.5, camera.position.z));
        }
        pinchDist = dist;
    }
}, { passive: true });
el.addEventListener('touchend', () => pinchDist = 0);

// Redimensionamento
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Iniciar tudo
window.addEventListener('load', init);
</script>
</body>
</html>
