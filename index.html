<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Livia IA - Assistente 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP (F            color:altava no código anterior) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(13, 20, 33, 0.95);
            --panel-border: rgba(0, 150, 255, 0.4);
            --accent-blue: #007bff;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #8ba0b8;
            --danger: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d1117; /* Fundo escuro para destacar o modelo */
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed; /* Evita scroll no mobile */
        }

        /* Canvas 3D */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Botão Flutuante do Menu (Estilo Hambúrguer) */
        .menu-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .menu-toggle.active {
            background: rgba(255, 71, 87, 0.8);
        }

        /* Painel Deslizante (Menu) */
        .side-panel {
            position: fixed;
            top: 0;
            right: -100%; /* Escondido */
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: rgba(13, 20, 33, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--panel-border);
            z-index: 90;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }

        .side-panel.open {
            right: 0;
        }

        .side-panel::-webkit-scrollbar { width: 5px; }
        .side-panel::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 5px; }

        /* Cabeçalho do Menu */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .panel-header h2 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cartões */
        .info-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-card h4 {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .info-row span:last-child { color: var(--accent-cyan); font-weight: 600; }

        /* Botões */
        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .action-btn.active {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
        }

        /* Grid de Botões */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .grid-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .grid-btn.active {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* Chat */
        .chat-input-container {
            margin-top: auto;
            position: relative;
            padding-top: 10px;
        }

        .chat-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 40px 12px 12px;
            color: white;
            font-size: 0.8rem;
            outline: none;
        }

        .chat-send {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
 var(--accent-cyan);
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }

        /* Aviso Flutuante */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>

    <!-- Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- Aviso -->
    <div class="hint" id="hint">
        <i class="fas fa-hand-pointer"></i> Toque nas partes para trocar
    </div>

    <!-- Botão Hambúrguer -->
    <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Painel do Menu -->
    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2><i class="fas fa-robot" style="color: var(--accent-cyan);"></i> Livia IA</h2>
            <button class="close-btn" id="close-btn"><i class="fas fa-times"></i></button>
        </div>

        <div class="info-card">
            <h4>Status Vital</h4>
            <div class="info-row"><span>🦴 Ossos</span><span>200</span></div>
            <div class="info-row"><span>❤️ Vida</span><span>14</span></div>
            <div class="info-row"><span>Energia</span><span>100%</span></div>
        </div>

        <button class="action-btn" id="btn-dar-vida">
            <i class="fas fa-heart"></i> Vida
        </button>

        <div class="info-card">
            <h4>Modos de Visualização</h4>
            <div class="btn-grid">
                <div class="grid-btn active" data-mode="normal"><i class="fas fa-user"></i> Normal</div>
                <div class="grid-btn" data-mode="skeleton"><i class="fas fa-bone"></i> Esqueleto</div>
                <div class="grid-btn" data-mode="robot"><i class="fas fa-robot"></i> Robô</div>
            </div>
        </div>

        <div class="info-card">
            <h4>Ações</h4>
            <div class="btn-grid">
                <div class="grid-btn"><i class="fas fa-walking"></i> Andar</div>
                <div class="grid-btn"><i class="fas fa-running"></i> Correr</div>
                <div class="grid-btn"><i class="fas fa-tshirt"></i> Guarda-Roupa</div>
                <div class="grid-btn"><i class="fas fa-camera"></i> Foto</div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="Fale com a Livia..." id="chat-input">
            <button class="chat-send" id="chat-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. AMBIENTE 3D (THREE.JS)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Câmera ajustada para mobile (mais afastada para caber o corpo inteiro)
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.0, 5.5); // Ajustado para ver o corpo todo no celular
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita o pixel ratio para performance mobile
        container.appendChild(renderer.domElement);

        // Iluminação Forte para o modelo aparecer bem
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Mais luz ambiente
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x00d4ff, 2.0);
        fillLight.position.set(-3, 2, 3);
        scene.add(fillLight);

        // ==========================================
        // 2. MODELO 3D (CORPO SÓLIDO E VISÍVEL)
        // ==========================================
        const characterGroup = new THREE.Group();
        
        // Cores dos Materiais
        const skinColor = 0xffd1b3; // Cor de pele clara
        const hairColor = 0x4a2c17; // Castanho
        const eyeColor = 0x2b1a0f;  // Castanho escuro
        const clothColor = 0x000000; // Preto (Biquíni)

        // Material da Pele
        const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.4, metalness: 0.1 });
        // Material do Cabelo
        const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });
        // Material dos Olhos
        const eyeMat = new THREE.MeshStandardMaterial({ color: eyeColor, roughness: 0.1 });
        // Material da Roupa
        const clothMat = new THREE.MeshStandardMaterial({ color: clothColor, roughness: 0.6 });

        // --- CABEÇA ---
        const headGeo = new THREE.SphereGeometry(0.22, 32, 32);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 1.65;
        characterGroup.add(head);

        // Cabelo (Meia esfera em cima da cabeça)
        const hairGeo = new THREE.SphereGeometry(0.24, 32, 16, 0, Math.PI * 2, 0, Math.PI / 1.8);
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.y = 1.68;
        hair.rotation.x = -0.1;
        characterGroup.add(hair);

        // Olhos (Esferas pequenas)
        const eyeGeo = new THREE.SphereGeometry(0.03, 16, 16);
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.07, 1.68, 0.2);
        characterGroup.add(leftEye);
        
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.07, 1.68, 0.2);
        characterGroup.add(rightEye);

        // --- PESCOÇO ---
        const neckGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 16);
        const neck = new THREE.Mesh(neckGeo, skinMat);
        neck.position.y = 1.42;
        characterGroup.add(neck);

        // --- TRONCO ---
        const torsoGeo = new THREE.CylinderGeometry(0.25, 0.22, 0.9, 16);
        const torso = new THREE.Mesh(torsoGeo, skinMat);
        torso.position.y = 1.0;
        characterGroup.add(torso);

        // Biquíni (Parte de cima)
        const topGeo = new THREE.CylinderGeometry(0.26, 0.25, 0.15, 16);
        const top = new THREE.Mesh(topGeo, clothMat);
        top.position.y = 1.15;
        characterGroup.add(top);

        // --- QUADRIL ---
        const hipGeo = new THREE.CylinderGeometry(0.22, 0.25, 0.3, 16);
        const hip = new THREE.Mesh(hipGeo, skinMat);
        hip.position.y = 0.5;
        characterGroup.add(hip);

        // Biquíni (Parte de baixo)
        const bottomGeo = new THREE.CylinderGeometry(0.23, 0.23, 0.1, 16);
        const bottom = new THREE.Mesh(bottomGeo, clothMat);
        bottom.position.y = 0.55;
        characterGroup.add(bottom);

        // --- BRAÇOS ---
        const armGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.8, 16);
        
        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.position.set(-0.38, 1.1, 0);
        leftArm.rotation.z = 0.15;
        characterGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.set(0.38, 1.1, 0);
        rightArm.rotation.z = -0.15;
        characterGroup.add(rightArm);

        // --- PERNAS ---
        const legGeo = new THREE.CylinderGeometry(0.09, 0.07, 1.0, 16);
        
        const leftLeg = new THREE.Mesh(legGeo, skinMat);
        leftLeg.position.set(-0.13, -0.1, 0);
        characterGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, skinMat);
        rightLeg.position.set(0.13, -0.1, 0);
        characterGroup.add(rightLeg);

        // Adiciona o grupo à cena
        scene.add(characterGroup);

        // ==========================================
        // 3. LÓGICA DE INTERFACE
        // ==========================================
        
        const menuToggle = document.getElementById('menu-toggle');
        const sidePanel = document.getElementById('side-panel');
        const closeBtn = document.getElementById('close-btn');
        const btnVida = document.getElementById('btn-dar-vida');
        const hint = document.getElementById('hint');
        
        let isAlive = false;
        let isRotating = true;

        // Abrir/Fechar Menu
        menuToggle.addEventListener('click', () => {
            sidePanel.classList.toggle('open');
            menuToggle.classList.toggle('active');
            hint.style.opacity = '0'; // Esconde a dica ao abrir o menu
        });

        closeBtn.addEventListener('click', () => {
            sidePanel.classList.remove('open');
            menuToggle.classList.remove('active');
        });

        // Botão "Vida"
        btnVida.addEventListener('click', () => {
            isAlive = !isAlive;
            if(isAlive) {
                btnVida.classList.add('active');
                btnVida.innerHTML = '<i class="fas fa-heartbeat"></i> Vida Ativa';
                gsap.to(characterGroup.scale, { x: 1.05, y: 1.05, z: 1.05, duration: 0.5, yoyo: true, repeat: -1 });
            } else {
                btnVida.classList.remove('active');
                btnVida.innerHTML = '<i class="fas fa-heart"></i> Vida';
                gsap.killTweensOf(characterGroup.scale);
                characterGroup.scale.set(1, 1, 1);
            }
        });

        // Modos de Visualização
        const modeBtns = document.querySelectorAll('[data-mode]');
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const mode = this.getAttribute('data-mode');
                
                if(mode === 'skeleton') {
                    skinMat.color.setHex(0xffffff);
                    skinMat.wireframe = true;
                    clothMat.color.setHex(0xffffff);
                    clothMat.wireframe = true;
                } else if(mode === 'robot') {
                    skinMat.color.setHex(0x00ff88);
                    skinMat.wireframe = false;
                    clothMat.color.setHex(0x007bff);
                    clothMat.wireframe = false;
                } else {
                    skinMat.color.setHex(skinColor);
                    skinMat.wireframe = false;
                    clothMat.color.setHex(clothColor);
                    clothMat.wireframe = false;
                }
            });
        });

        // Chat
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        
        function sendMessage() {
            const text = chatInput.value.trim();
            if(!text) return;
            chatInput.value = '';
            chatInput.placeholder = "Livia está pensando...";
            
            setTimeout(() => {
                chatInput.placeholder = `Livia: "Entendi! Você disse: ${text}"`;
            }, 1000);
        }

        chatSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });

        // ==========================================
        // 4. ANIMAÇÃO
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Rotação suave (Frente e Costas)
            if(!isAlive) {
                characterGroup.rotation.y += 0.008; // Gira devagar
            } else {
                // Balança levemente
                characterGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.4;
            }

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
