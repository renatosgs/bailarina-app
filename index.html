<script>
let selectedStyle = "TikTok";
const AGNES_API_KEY = "sk-1rHcI3yVp5FdL63gjo9BX3aBLw65FBDIxIUzKvZPffOlew8t";

/* Foto */
document.getElementById("photo").addEventListener("change", function(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById("preview");
  const content = document.getElementById("uploadContent");
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  content.style.display = "none";
});

/* Estilos */
document.querySelectorAll(".style").forEach(style => {
  style.addEventListener("click", () => {
    document.querySelectorAll(".style")
      .forEach(s => s.classList.remove("active"));
    style.classList.add("active");
    selectedStyle = style.dataset.style;
  });
});

/* Duração */
document.getElementById("duration")
  .addEventListener("input", function(){
    document.getElementById("durationValue")
      .innerText = this.value + "s";
  });

/* Intensidade */
document.getElementById("intensity")
  .addEventListener("input", function(){
    const values = ["Leve", "Médio", "Intenso"];
    document.getElementById("intensityValue")
      .innerText = values[this.value - 1];
  });

/* ---- Upload da foto para o Imgur ---- */
async function uploadParaImgur(file) {
  const formData = new FormData();
  formData.append("image", file);
  const CLIENT_ID = "546c25a59c58ad7"; // Client ID público do Imgur

  const resposta = await fetch("https://api.imgur.com/3/image", {
    method: "POST",
    headers: { "Authorization": "Client-ID " + CLIENT_ID },
    body: formData
  });
  const dados = await resposta.json();
  if (!dados.success) throw new Error("Falha no upload da imagem.");
  return dados.data.link;
}

/* ---- Gerar Vídeo ---- */
async function generateVideo(){
  const photo = document.getElementById("photo").files[0];
  if(!photo){ alert("Adicione uma foto primeiro."); return; }

  const duration = parseInt(document.getElementById("duration").value);
  const intensity = document.getElementById("intensity").value;
  const status = document.getElementById("status");
  status.style.display = "block";

  try {
    /* 1. Upload da imagem */
    status.innerHTML = `<div class="spinner"></div><div>Enviando sua foto...</div>`;
    const urlDaFoto = await uploadParaImgur(photo);
    console.log("URL da foto:", urlDaFoto);

    /* 2. Montar prompt */
    const intensidades = ["subtle", "moderate", "energetic"];
    const prompt = `A person dancing ${selectedStyle} style, ${intensidades[intensity - 1]} movement, natural motion, cinematic lighting`;

    /* 3. Chamar a API da Agnes */
    status.innerHTML = `<div class="spinner"></div><div>Gerando sua dança...</div><small>Isso pode levar alguns minutos.</small>`;
    
    const respostaAgnes = await fetch("https://apihub.agnes-ai.com/v1/videos", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${AGNES_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "agnes-video-v2.0",
        prompt: prompt,
        image: urlDaFoto,
        num_frames: duration * 24,
        frame_rate: 24
      })
    });

    const dadosAgnes = await respostaAgnes.json();
    console.log("Resposta da Agnes:", dadosAgnes);

    if (!respostaAgnes.ok) {
      throw new Error(dadosAgnes.error?.message || JSON.stringify(dadosAgnes));
    }

    const videoId = dadosAgnes.id || dadosAgnes.video_id || dadosAgnes.task_id;
    if (!videoId) throw new Error("ID da tarefa não retornado: " + JSON.stringify(dadosAgnes));

    /* 4. Polling */
    let urlDoVideo = null;
    let tentativas = 0;
    const maxTentativas = 60;

    while (!urlDoVideo && tentativas < maxTentativas) {
      await new Promise(r => setTimeout(r, 3000));
      tentativas++;

      const statusResposta = await fetch(`https://apihub.agnes-ai.com/v1/videos/${videoId}`, {
        headers: { "Authorization": `Bearer ${AGNES_API_KEY}` }
      });
      const statusDados = await statusResposta.json();
      console.log("Status tentativa " + tentativas + ":", statusDados);

      if (statusDados.status === "completed" || statusDados.status === "succeeded") {
        urlDoVideo = statusDados.metadata?.url || statusDados.url || statusDados.output?.url || statusDados.video_url;
      } else if (statusDados.status === "failed") {
        throw new Error("A geração do vídeo falhou.");
      }
    }

    if (!urlDoVideo) throw new Error("Tempo limite excedido. Tente novamente.");

    /* 5. Exibir o vídeo */
    status.innerHTML = `
      <div style="font-size:35px">🎬</div>
      <div>Vídeo gerado com sucesso!</div>
      <video src="${urlDoVideo}" controls autoplay loop 
             style="width:100%; border-radius:15px; margin-top:15px;"></video>
      <a href="${urlDoVideo}" download="dance-ai.mp4" 
         style="display:inline-block; margin-top:12px; color:#c084fc; text-decoration:none;">
         ⬇ Baixar vídeo
      </a>
    `;

  } catch (erro) {
    console.error(erro);
    status.innerHTML = `
      <div style="font-size:35px">⚠️</div>
      <div>Erro ao gerar o vídeo</div>
      <small>${erro.message}</small>
    `;
  }
}
</script>
