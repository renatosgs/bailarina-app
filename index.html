<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dançarina Real 3D - Palco & IA</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05050a; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #painel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(15, 15, 25, 0.9); border: 1px solid #ff2a70;
      border-radius: 10px; padding: 14px; width: 280px; color: white;
      z-index: 10;
    }
    .btn {
      display: block; width: 100%; padding: 10px; margin: 6px 0;
      background: #ff2a70; border: none; border-radius: 6px;
      color: white; font-weight: bold; cursor: pointer; text-align: center;
    }
    .btn:hover { background: #d81b60; }
    #comparador {
      width: 100%; max-height: 150px; object-fit: cover;
      border-radius: 6px; display: none; margin-top: 8px; border: 1px solid #00ffaa;
    }
    .status { font-size: 11px; color: #00ffaa; margin-top: 4px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="painel">
  <label class="btn">
    📷 Carregar Foto da Dançarina
    <input type="file" id="input-foto" accept="image/*" style="display:none">
  </label>
  <img id="comparador" alt="Foto Original">
  <div id="status-ia" class="status"></div>

  <button class="btn" onclick="tocarAnimacao('funk')">🔥 Dançar Funk até o Chão</button>
  <button class="btn" onclick="tocarAnimacao('agachar')">🧘 Agachar</button>
  <button class="btn" onclick="tocarAnimacao('sentar')">🪑 Sentar</button>
  <button class="btn" onclick="tocarAnimacao('deitar')">🛌 Deitar</button>
  <button class="btn" onclick="tocarAnimacao('pose')">📸 Pose da Foto</button>
</div>

<div id="canvas-container"></div>

<script>
  // 1. Cena, Câmera e Palco Amplo com Chão Real
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06060c);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 3.8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);

  // Palco Grande Iluminado (12 metros de diâmetro, reflexivo)
  const palco = new THREE.Mesh(
    new THREE.CylinderGeometry(6, 6.2, 0.2, 64),
    new THREE.MeshStandardMaterial({ color: 0x121218, roughness: 0.2, metalness: 0.5 })
  );
  palco.position.y = -0.1;
  palco.receiveShadow = true;
  scene.add(palco);

  // Iluminação Cênica
  const luzSpot = new THREE.SpotLight(0xffffff, 2.5, 25, Math.PI/4, 0.3);
  luzSpot.position.set(0, 6, 3);
  luzSpot.castShadow = true;
  scene.add(luzSpot);
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));

  // 2. Carregamento do Modelo Humano Real (SkinnedMesh Contínuo)
  // Utiliza um modelo humano padrão GLTF com esqueleto completo
  let bailarinaMesh = null;
  let mixer = null;
  let boneQuadril = null;
  let boneCoxaEsq = null, boneCoxaDir = null;

  const loader = new THREE.GLTFLoader();
  // Você pode substituir pela URL de qualquer modelo humano GLB/GLTF feminino real
  loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', function(gltf) {
    const model = gltf.scene;
    model.scale.set(0.95, 0.95, 0.95);
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        bailarinaMesh = child;
      }
      // Identifica os ossos principais para deformação de perna inteira
      if (child.isBone) {
        if (child.name.includes('Hips')) boneQuadril = child;
        if (child.name.includes('LeftUpLeg')) boneCoxaEsq = child;
        if (child.name.includes('RightUpLeg')) boneCoxaDir = child;
      }
    });
    scene.add(model);
  });

  // 3. IA Invisível: Aplica o Rosto e o Vestido da Foto no Modelo 3D
  document.getElementById('input-foto').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const imgUrl = URL.createObjectURL(file);
    const compImg = document.getElementById('comparador');
    compImg.src = imgUrl;
    compImg.style.display = 'block';
    document.getElementById('status-ia').innerText = "✓ Aplicando rosto, vestido e medidas...";

    // Transforma a foto real diretamente em textura do modelo
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load(imgUrl, function(texturaFoto) {
      if (bailarinaMesh) {
        bailarinaMesh.material.map = texturaFoto;
        bailarinaMesh.material.needsUpdate = true;
      }
    });
  });

  // 4. Animação de Funk (Mãos no Joelho e Rebolar até o chão)
  let estado = 'pose';
  let t = 0;
  function tocarAnimacao(nome) {
    estado = nome;
    t = 0;
  }

  function loop() {
    requestAnimationFrame(loop);
    t += 0.05;

    if (boneQuadril && estado === 'funk') {
      // Rebolado e descida até o chão com a perna inteira acompanhando
      const descida = (Math.sin(t * 0.8) + 1) / 2;
      boneQuadril.position.y = THREE.MathUtils.lerp(0.9, 0.4, descida);
      boneQuadril.rotation.y = Math.sin(t * 7) * 0.3; // Twerk lateral
      boneQuadril.rotation.x = Math.cos(t * 7) * 0.2 + 0.3; // Rebolado frente/costas
      
      if (boneCoxaEsq && boneCoxaDir) {
        boneCoxaEsq.rotation.x = -THREE.MathUtils.lerp(0.6, 1.4, descida);
        boneCoxaDir.rotation.x = -THREE.MathUtils.lerp(0.6, 1.4, descida);
      }
    } else if (boneQuadril && estado === 'pose') {
      boneQuadril.position.y = 0.98;
      boneQuadril.rotation.set(0, 0, 0);
    }

    renderer.render(scene, camera);
  }
  loop();
</script>
</body>
</html>
