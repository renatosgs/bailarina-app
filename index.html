<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilização Abstrata - Glúteos Simétricos</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7ede2;
            margin: 0;
        }

        /* Contêiner principal para a silhueta */
        .silhueta-container {
            display: flex;
            position: relative;
            width: 320px;
            height: 240px;
            justify-content: center;
            align-items: center;
        }

        /* Definição de cada glúteo baseado em curvas suaves e volume */
        .gluteo {
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, #e0a96d 0%, #b87d4b 100%);
            box-shadow: inset -5px -10px 20px rgba(0, 0, 0, 0.2), 
                        0 10px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        /* Lado esquerdo: curvatura acentuada para fora */
        .esquerdo {
            border-radius: 65% 35% 35% 65% / 50% 30% 70% 50%;
            transform: translateX(5px);
        }

        /* Lado direito: espelhamento perfeito para simetria */
        .direito {
            border-radius: 35% 65% 65% 35% / 30% 50% 50% 70%;
            transform: translateX(-5px);
        }

        /* Efeito visual simulando contorno estético e firmeza */
        .silhueta-container:hover .esquerdo {
            transform: translateX(2px) scale(1.02);
        }

        .silhueta-container:hover .direito {
            transform: translateX(-2px) scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Estrutura que representa o contorno e simetria dos glúteos -->
    <div class="silhueta-container" aria-label="Representação visual de curvas corporais">
        <div class="gluteo esquerdo"></div>
        <div class="gluteo direito"></div>
    </div>

</body>
</html>
