<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 3D: Customização & Animação (Index Unificado)</title>
    <!-- Inclusão do Three.js via CDN para processamento de malhas e renderização gráfica em tempo real -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Área de Visualização do Motor Gráfico */
        #viewport-container {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #ff007f;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #ui-overlay h1 {
            font-size: 1.1em;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        #ui-overlay p {
            font-size: 0.8em;
            color: #aaaaaa;
        }
        /* Painel Lateral Unificado de Configurações */
        #sidebar {
            width: 420px;
            background-color: #161616;
            border-left: 2px solid #252525;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            z-index: 10;
        }
        .tabs {
            display: flex;
            background: #0f0f0f;
            border-bottom: 2px solid #252525;
        }
        .tab-btn {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            color: #888888;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #ff007f;
            border-bottom: 3px solid #ff007f;
            background: #161616;
        }
        .tab-content {
            flex: 1;
            padding: 22px;
            overflow-y: auto;
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* Estilização dos Controles e Sliders */
        .control-section-title {
            font-size: 0.85em;
            color: #ff007f;
            text-transform: uppercase;
            margin: 18px 0 8px 0;
            display: block;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .control-group {
            margin-bottom: 14px;
            background: #1e1e1e;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 8px;
            color: #dddddd;
        }
        .val-badge {
            color: #00ffcc;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff007f;
            background: #333;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        /* Seletor do Catálogo de 90 Biquínis */
        .select-custom {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 15px;
            outline: none;
            font-size: 0.9em;
        }
        .bikini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .bikini-item {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.78em;
            transition: all 0.2s ease;
        }
        .bikini-item:hover, .bikini-item.selected {
            border-color: #ff007f;
            background: rgba(255, 0, 127, 0.08);
            transform: translateY(-2px);
        }
        .bikini-thumb {
            height: 35px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
        }
        /* Botões de Movimentos e Coreografias */
        .dance-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-dance {
            padding: 14px;
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .btn-dance:hover, .btn-dance.active {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
        }
        /* Botão Gerador de Personagem */
        .btn-generator {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00ffcc, #007fff);
            border: none;
            border-radius: 6px;
            color: #0b0b0b;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
            transition: opacity 0.2s;
        }
        .btn-generator:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Módulo de Visualização Espacial (Canvas 3D) -->
    <div id="viewport-container">
        <div id="ui-overlay">
            <h1>Engine de Renderização Real-Time</h1>
            <p>Arraste na tela para rotacionar o manequim gráfico</p>
        </div>
    </div>

    <!-- Módulo de Controle Unificado (Sidebar) -->
    <div id="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('body-tab')">Métricas</button>
            <button class="tab-btn" onclick="switchTab('clothes-tab')">Coleções (90)</button>
            <button class="tab-btn" onclick="switchTab('dance-tab')">Coreografias</button>
        </div>

        <!-- ABA 1: PARÂMETROS DO BIOTIPO -->
        <div id="body-tab" class="tab-content active">
            <button class="btn-generator" onclick="generateRandomCharacter()">Gerar Estrutura Aleatória</button>
            
            <span class="control-section-title">Estatura</span>
            <div class="control-group">
                <label>Altura Estimada <span class="val-badge" id="lbl-altura">1.75 m</span></label>
                <input type="range" min="150" max="195" value="175" id="slider-altura">
            </div>

            <span class="control-section-title">Busto e Tronco</span>
            <div class="control-group">
                <label>Circunferência do Busto <span class="val-badge" id="lbl-busto">92 cm</span></label>
                <input type="range" min="80" max="115" value="92" id="slider-busto">
            </div>
            <div class="control-group">
                <label>Linha de Cintura <span class="val-badge" id="lbl-cintura">62 cm</span></label>
                <input type="range" min="55" max="85" value="62" id="slider-cintura">
            </div>

            <span class="control-section-title">Quadril e Membros</span>
            <div class="control-group">
                <label>Métrica do Quadril <span class="val-badge" id="lbl-quadril">105 cm</span></label>
                <input type="range" min="85" max="125" value="105" id="slider-quadril">
            </div>
            <div class="control-group">
                <label>Volume de Coxas <span class="val-badge" id="lbl-coxas">58 cm</span></label>
                <input type="range" min="45" max="75" value="58" id="slider-coxas">
            </div>

            <span class="control-section-title">Estética de Extremidades</span>
            <div class="control-group">
                <label>Comprimento dos Cabelos <span class="val-badge" id="lbl-cabelo">70 cm</span></label>
                <input type="range" min="10" max="110" value="70" id="slider-cabelo">
            </div>
        </div>

        <!-- ABA 2: INTEGRALIZAÇÃO DE 90 BIQUÍNIS -->
        <div id="clothes-tab" class="tab-content">
            <label>Navegar pelo Catálogo (90 Variações):</label>
            <select id="bikini-category" class="select-custom" onchange="loadBikiniCatalog()">
                <option value="fita">Coleção Fita Isolante (Peças 1 a 30)</option>
                <option value="asa">Coleção Asa Delta / Carnaval (Peças 31 a 60)</option>
                <option value="croche">Coleção Crochê & Resort (Peças 61 a 90)</option>
            </select>
            
            <div class="bikini-grid" id="catalog-container">
                <!-- Populado dinamicamente por script interno -->
            </div>
        </div>

        <!-- ABA 3: EXECUÇÃO DE DINÂMICAS DE FUNK -->
