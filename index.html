<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelagem Geométrica Corporal Detalhada</title>
    <style>
        :root {
            /* Paleta de Cores Corporais (Branca Rosada) */
            --pele-base: #fcdbd1;
            --pele-sombra: #e8b1a2;
            --pele-luz: #fff2ed;
            --cabelo: #29180b;
            --boca: #e07b7b;
            --olhos: #4a321a;
            --unhas: #f5b0bd;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #16161a;
            margin: 0;
            padding: 40px 0;
        }

        /* 1. ESTRUTURA E TAMANHOS GERAIS (Eixo Vertical) */
        .silhueta-completa {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 380px;
            height: 920px; /* Altura proporcional total */
        }

        /* 2. CABELO, CABEÇA E DETALHES FACIAIS */
        .cabelo-movimento {
            position: absolute;
            top: 0;
            width: 130px;
            height: 310px;
            background: linear-gradient(135deg, var(--cabelo), #140b05);
            border-radius: 50% 50% 30% 30% / 30% 30% 70% 70%;
            z-index: 1;
            transform-origin: top center;
            animation: balanco 3s ease-in-out infinite alternate;
        }

        .cabeca-estrutura {
            position: relative;
            top: 20px;
            width: 65px;   /* Largura exata da cabeça */
            height: 85px;  /* Altura proporcional do rosto */
            background: linear-gradient(to bottom, var(--pele-luz), var(--pele-base));
            border-radius: 50% 50% 45% 45% / 45% 45% 55% 55%;
            z-index: 3;
            box-shadow: inset 0 -5px 10px var(--pele-sombra);
        }

        .olho {
            position: absolute;
            top: 30px;
            width: 12px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            animation: piscar 4s linear infinite;
        }
        .o-esq { left: 12px; }
        .o-dir { right: 12px; }
        .olho::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--olhos);
            border-radius: 50%;
            left: 3px;
        }

        .boca-carnuda {
            position: absolute;
            bottom: 16px;
            left: 20px;
            width: 25px;   /* Boca volumosa */
            height: 10px;
            background: var(--boca);
            border-radius: 40% 40% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset 0 -2px 3px rgba(0,0,0,0.2);
        }

        /* 3. TRONCO, ESPESSURAS E MEMBROS SUPERIORES */
        .pescoco {
            width: 18px;
            height: 30px;
            background: var(--pele-base);
            margin-top: 15px;
            z-index: 2;
        }

        .ombros-busto {
            display: flex;
            justify-content: space-between;
            position: relative;
            width: 140px;  /* Largura total dos ombros */
            height: 95px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 40% 40% 25% 25% / 20% 20% 80% 80%;
            z-index: 3;
        }

        .braco {
            position: absolute;
            top: 10px;
            width: 20px;   /* Grossura do braço */
            height: 250px; /* Extensão até o quadril */
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 10px;
            z-index: 2;
        }
        .b-esq { left: -14px; transform: rotate(4deg); }
        .b-dir { right: -14px; transform: rotate(-4deg); }

        /* 4. CINTURA, ABDÔMEN E UMBIGO */
        .cintura-escapular {
            position: relative;
            width: 78px;   /* Afunilamento da cintura (linha fina) */
            height: 75px;
            background: linear-gradient(to bottom, var(--pele-sombra), var(--pele-base));
            z-index: 3;
            margin-top: -5px;
        }

        .umbigo {
            position: absolute;
            left: 36px;
            bottom: 15px;
            width: 6px;
            height: 8px;
            background: var(--pele-sombra);
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 5. QUADRIL E REGIÃO PÉLVICA ANATÔMICA */
        .quadril-estrutura {
            position: relative;
            display: flex;
            justify-content: center;
            width: 155px;  /* Proporção curvilínea alargada */
            height: 120px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 45% 45% 15% 15% / 30% 30% 70% 70%;
            z-index: 3;
            margin-top: -5px;
        }

        /* Divisão pélvica geométrica central */
        .regiao-pelvica {
            position: absolute;
            bottom: 0;
            width: 22px;
            height: 45px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 50% 50% 40% 40% / 80% 80% 20% 20%;
            box-shadow: inset 1px 0 4px rgba(0,0,0,0.15), inset -1px 0 4px rgba(0,0,0,0.15);
        }

        .fenda-central {
            width: 2px;
            height: 30px;
            background: rgba(145, 91, 78, 0.4);
            margin: 10px auto 0 auto;
            border-radius: 50%;
        }

        /* 6. PERNAS (GROSSURAS DAS COXAS E PANTURRILHAS) */
        .pernas-container {
            display: flex;
            justify-content: space-between;
            width: 130px;
            height: 420px; /* Comprimento total das pernas */
            z-index: 2;
            margin-top: -10px;
        }

        .perna-membro {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            height: 100%;
        }

        /* Coxas grossas e torneadas */
        .coxa {
            width: 58px;   /* Espessura acentuada da coxa */
            height: 220px; /* Comprimento da coxa */
            background: linear-gradient(to bottom, var(--pele-sombra), var(--pele-base));
            border-radius: 55% 45% 35% 35% / 25% 25% 75% 75%;
        }

        /* Panturrilhas afuniladas */
        .panturrilha {
            width: 38px;   /* Transição para uma espessura menor */
            height: 200px;
            background: linear-gradient(to bottom, var(--pele-base), var(--pele-sombra));
            border-radius: 35% 35% 20% 20% / 15% 15% 85% 85%;
            margin-top: -5px;
        }

        /* 7. EXTREMIDADES (PÉS E UNHAS) */
        .pes-container {
            display: flex;
            justify-content: space-between;
            width: 135px;
            height: 25px;
            z-index: 3;
            margin-top: -2px;
        }

        .pe {
            position: relative;
            width: 48px;
            height: 100%;
            background: var(--pele-sombra);
            border-radius: 10% 50% 30% 20% / 10% 70% 30% 30%;
        }

        /* Unhas detalhadas com coloração rosada suave */
        .unhas-container {
            display: flex;
            justify-content: flex-end;
            gap: 2px;
            padding-right: 4px;
            margin-top: 2px;
        }

        .unha {
            width: 4px;
            height: 5px;
            background: var(--unhas);
            border-radius: 2px 2px 0 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* 8. ANIMAÇÕES EM CSS */
        @keyframes balanco {
            0% { transform: rotate(-2deg); }
            100% { transform: rotate(2deg); }
        }

        @keyframes piscar {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

    <div class="silhueta-completa" aria-label="Estrutura de modelagem anatômica por código">
        
        <!-- Segmento Superior -->
        <div class="cabelo-movimento"></div>
        <div class="cabeca-estrutura">
            <div class="olho o-esq"></div>
            <div class="olho o-dir"></div>
            <div class="boca-carnuda"></div>
        </div>
        <div class="pescoco"></div>

        <!-- Segmento do Tronco e Braços Laterais -->
        <div class="ombros-busto">
            <div class="braco b-esq"></div>
            <div class="braco b-dir"></div>
        </div>
        <div class="cintura-escapular">
            <div class="umbigo"></div>
        </div>

        <!-- Segmento Pélvico e Divisão Central -->
        <div class="quadril-estrutura">
            <div class="regiao-pelvica">
                <div class="fenda-central"></div>
            </div>
        </div>

        <!-- Membros Inferiores (Coxas e Panturrilhas) -->
        <div class="pernas-container">
            <div class="perna-membro">
                <div class="coxa"></div>
                <div class="panturrilha"></div>
            </div>
            <div class="perna-membro">
                <div class="coxa"></div>
                <div class="panturrilha"></div>
            </div>
        </div>

        <!-- Base (Pés e Unhas Detalhadas) -->
        <div class="pes-container">
            <div class="pe">
                <div class="unhas-container">
                    <div class="unha"></div>
                    <div class="unha"></div>
                    <div class="unha"></div>
                </div>
            </div>
            <div class="pe">
                <div class="unhas-container">
                    <div class="unha"></div>
                    <div class="unha"></div>
