<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#05070a">
    <title>Livia IA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html { background-color: #05070a !important; color-scheme: dark; }
        body { background-color: #05070a !important; color: #fff; overflow: hidden; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 123, 255, 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 123, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0; pointer-events: none;
        }

        .floor {
            position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%);
            width: 75%; height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            box-shadow: 0 0 40px #00d4ff; z-index: 1;
        }

        .aura {
            position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; max-width: 450px; height: 80vh;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, transparent 70%);
            z-index: 1; pointer-events: none;
        }

        #character-container {
            position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; max-width: 420px; height: 80vh;
            z-index: 2; display: flex; justify-content: center; align-items: center;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.4));
        }

        #character-svg { width: 100%; height: 100%; overflow: visible; }

        .menu-toggle {
            position: fixed; top: 20px; right: 20px;
            width: 58px; height: 58px; border-radius: 50%;
            background: rgba(0, 150, 255, 0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: white; font-size: 1.4rem; cursor: pointer;
            z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            transition: all 0.3s;
        }
        .menu-toggle.active { background: rgba(255, 71, 87, 0.9); transform: rotate(90deg); }

        .side-panel {
            position: fixed; top: 0; right: -100%;
            width: 100%; max-width: 380px; height: 100%;
            background: #0d1421;
            border-left: 1px solid rgba(0, 150, 255, 0.3);
            z-index: 9998;
            transition: right 0.4s ease-out;
            display: flex; flex-direction: column;
            padding: 20px; gap: 15px;
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.9);
        }
        .side-panel.open { right: 0; }
        .side-panel::-webkit-scrollbar { width: 4px; }
        .side-panel::-webkit-scrollbar-thumb { background: #007bff; border-radius: 4px; }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .panel-header h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: #00d4ff; }
        .close-btn {
            background: rgba(255, 255, 255, 0.08); border: none; color: white;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .close-btn:hover { background: #ff4757; }

        .info-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px; padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-card h4 {
            font-size: 0.7rem; color: #8ba0b8;
            margin-bottom: 10px; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }

        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: #ccd6e0; }
        .info-row span:last-child { color: #00d4ff; font-weight: 700; }

        .slider-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #ccd6e0; font-weight: 500; }
        .slider-label span:last-child { color: #00d4ff; font-weight: 700; font-size: 0.7rem; }

        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 5px; border-radius: 5px;
            background: rgba(255, 255, 255, 0.1); outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            cursor: pointer; box-shadow: 0 0 10px rgba(0, 212, 255, 0.7);
        }

        .action-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            color: white; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 10px; transition: all 0.3s;
        }
        .action-btn.active { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .action-btn.reset { background: linear-gradient(135deg, #6c757d, #495057); font-size: 0.8rem; padding: 10px; }
        .action-btn.success { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #000; }
        .action-btn.body-btn { background: linear-gradient(135deg, #9c27b0, #ba68c8); }
        .action-btn.remove-photo { background: linear-gradient(135deg, #ff4757, #c0392b); font-size: 0.8rem; padding: 10px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

        .grid-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8ba0b8; padding: 10px 5px;
            border-radius: 10px; font-size: 0.7rem; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; font-weight: 500;
        }
        .grid-btn.active { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border-color: #00d4ff; font-weight: 700; }
        .grid-btn i { font-size: 1.1rem; }

        .chat-input-container { margin-top: auto; position: relative; padding-top: 10px; }
        .chat-input {
            width: 100%; background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 14px 45px 14px 14px;
            color: white; font-size: 0.85rem; outline: none;
        }
        .chat-send {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #00d4ff;
            cursor: pointer; font-size: 1.1rem; margin-top: 5px;
        }

        .hint {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); padding: 10px 20px; border-radius: 25px;
            font-size: 0.75rem; color: rgba(255, 255, 255, 0.9);
            z-index: 10; border: 1px solid rgba(0, 212, 255, 0.3);
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }

        .quick-stats { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 50; }
        .stat-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff;
        }
        .stat-badge.red { color: #ff4757; border-color: rgba(255, 71, 87, 0.3); }

        .toast {
            position: fixed; top: 90px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 212, 255, 0.95); color: #000;
            padding: 12px 24px; border-radius: 25px;
            font-weight: 700; font-size: 0.85rem;
            z-index: 99999; opacity: 0; pointer-events: none;
            transition: all 0.3s;
            max-width: 90%; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #body-photo-input { display: none; }

        #error-box {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 71, 87, 0.95); color: white;
            padding: 12px 20px; border-radius: 10px;
            font-size: 0.75rem; z-index: 99999; display: none;
            max-width: 90%; text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="floor"></div>
    <div class="aura"></div>

    <input type="file" id="body-photo-input" accept="image/*">

    <div id="character-container">
        <svg id="character-svg" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="skinGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffe0c4"/>
                    <stop offset="70%" stop-color="#f5b590"/>
                    <stop offset="100%" stop-color="#e89b78"/>
                </radialGradient>
                <radialGradient id="muscleGrad" cx="50%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#e74c3c"/>
                    <stop offset="60%" stop-color="#c0392b"/>
                    <stop offset="100%" stop-color="#8b2a1e"/>
                </radialGradient>
                <radialGradient id="hairGrad" cx="40%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#7a4a20"/>
                    <stop offset="50%" stop-color="#5d3a1a"/>
                    <stop offset="100%" stop-color="#3a2210"/>
                </radialGradient>
                <radialGradient id="boneGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#d4c9a8"/>
                </radialGradient>
                <linearGradient id="outfitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1a1a2e"/>
                    <stop offset="100%" stop-color="#0a0a1a"/>

                <clipPath id="body-clip">
                    <rect x="40" y="130" width="220" height="460" rx="20"/>
                </clipPath>
            </defs>

            <g id="character-group">
                <image id="body-photo" x="40" y="130" width="220" height="460" preserveAspectRatio="xMidYMid slice" clip-path="url(#body-clip)" style="display: none;"/>
                
                <g id="left-leg" class="body-part">
                    <ellipse cx="125" cy="410" rx="20" ry="58" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1"/>
                    <circle cx="125" cy="470" r="13" fill="url(#boneGrad)" stroke="#c9c9a8" stroke-width="1.5"/>
                    <ellipse cx="125" cy="518" rx="16" ry="48" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1"/>
                    <ellipse cx="125" cy="572" rx="14" ry="9" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                </g>
                
                <g id="right-leg" class="body-part">
                    <ellipse cx="175" cy="410" rx="20" ry="58" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1"/>
                    <circle cx="175" cy="470" r="13" fill="url(#boneGrad)" stroke="#c9c9a8" stroke-width="1.5"/>
                    <ellipse cx="175" cy="518" rx="16" ry="48" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1"/>
                    <ellipse cx="175" cy="572" rx="14" ry="9" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                </g>

                <g id="hip-group" class="body-part">
                    <ellipse cx="150" cy="362" rx="40" ry="32" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                    <path d="M 110 358 Q 150 390 190 358 L 190 378 Q 150 408 110 378 Z" fill="url(#outfitGrad)" id="outfit-bottom"/>
                </g>

                <g id="torso-group" class="body-part">
                    <ellipse cx="150" cy="322" rx="32" ry="42" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                    <ellipse cx="150" cy="265" rx="40" ry="44" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                </g>

                <g id="breasts-group" class="body-part">
                    <circle cx="132" cy="250" r="18" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                    <circle cx="168" cy="250" r="18" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                    <path d="M 113 238 Q 132 258 150 246 Q 168 258 187 238 L 183 252 Q 168 266 150 256 Q 132 266 117 252 Z" fill="url(#outfitGrad)" id="outfit-top"/>
                </g>

                <g id="left-arm" class="body-part">
                    <ellipse cx="103" cy="270" rx="14" ry="44" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1" transform="rotate(12 103 270)"/>
                    <ellipse cx="87" cy="345" rx="12" ry="42" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1" transform="rotate(20 87 345)"/>
                    <circle cx="79" cy="394" r="12" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                </g>

                <g id="right-arm" class="body-part">
                    <ellipse cx="197" cy="270" rx="14" ry="44" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1" transform="rotate(-12 197 270)"/>
                    <ellipse cx="213" cy="345" rx="12" ry="42" fill="url(#muscleGrad)" stroke="#8b2a1e" stroke-width="1" transform="rotate(-20 213 345)"/>
                    <circle cx="221" cy="394" r="12" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                </g>

                <rect x="142" y="215" width="16" height="24" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>

                <g id="head-group" class="body-part">
                    <ellipse cx="150" cy="190" rx="32" ry="36" fill="url(#skinGrad)" stroke="#c88a68" stroke-width="1"/>
                    
                    <g id="face-features">
                        <ellipse cx="139" cy="188" rx="4" ry="5" fill="#ffffff"/>
                        <circle cx="139" cy="189" r="2.5" fill="#3d2415"/>
                        <ellipse cx="161" cy="188" rx="4" ry="5" fill="#ffffff"/>
                        <circle cx="161" cy="189" r="2.5" fill="#3d2415"/>
                        <path d="M 133 179 Q 139 176 145 179" stroke="#3d2415" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                        <path d="M 155 179 Q 161 176 167 179" stroke="#3d2415" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                        <path d="M 150 192 L 148 200 L 152 200 Z" fill="#d4a088" opacity="0.8"/>
                        <path d="M 144 210 Q 150 214 156 210" stroke="#a93226" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    </g>
                    
                    <g id="hair-group">
                        <path d="M 118 185 Q 112 140 150 138 Q 188 140 182 185 Q 180 168 150 162 Q 120 168 118 185 Z" fill="url(#hairGrad)"/>
                        <path d="M 118 185 Q 112 220 120 255 L 130 255 Q 122 220 126 190 Z" fill="url(#hairGrad)"/>
                        <path d="M 182 185 Q 188 220 180 255 L 170 255 Q 178 220 174 190 Z" fill="url(#hairGrad)"/>
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <div class="quick-stats">
        <div class="stat-badge"><i class="fas fa-bone"></i> 200</div>
        <div class="stat-badge red"><i class="fas fa-heart"></i> 14</div>
    </div>

    <div class="hint" id="hint">
        <i class="fas fa-hand-pointer"></i> Abra o menu para ajustar
    </div>

    <div class="toast" id="toast">Feito!</div>

    <button class="menu-toggle" id="menu-toggle" type="button">
        <i class="fas fa-bars"></i>
    </button>

    <div class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2><i class="fas fa-robot"></i> Livia IA</h2>
            <button class="close-btn" id="close-btn" type="button"><i class="fas fa-times"></i></button>
        </div>

        <div class="info-card">
            <h4><i class="fas fa-heartbeat"></i> Status Vital</h4>
            <div class="info-row"><span>🦴 Ossos</span><span>200</span></div>
            <div class="info-row"><span>❤️ Vida</span><span>14</span></div>
            <div class="info-row"><span>⚡ Energia</span><span>100%</span></div>
        </div>

        <button class="action-btn" id="btn-dar-vida" type="button">
            <i class="fas fa-heart"></i> Dar Vida
        </button>

        <!-- CORPO PERSONALIZADO -->
        <div class="info-card" style="background: rgba(156, 39, 176, 0.08); border-color: rgba(156, 39, 176, 0.3);">
            <h4><i class="fas fa-user" style="color: #ba68c8;"></i> Corpo Personalizado</h4>
            <button class="action-btn body-btn" id="btn-change-body" type="button">
                <i class="fas fa-camera"></i> Mudar Corpo por Foto
            </button>
            <button class="action-btn remove-photo" id="btn-remove-body" style="margin-top: 8px; display: none;" type="button">
                <i class="fas fa-trash"></i> Remover Corpo
            </button>
            <div style="font-size: 0.7rem; color: #8ba0b8; margin-top: 8px; text-align: center;">
                💡 Use uma foto de corpo inteiro
            </div>
        </div>

        <div class="info-card">
            <h4><i class="fas fa-sliders-h"></i> Ajustes Corporais</h4>
            
            <div class="slider-group">
                <div class="slider-label"><span>Altura Total</span><span id="val-height">1.00</span></div>
                <input type="range" id="slider-height" min="0.7" max="1.3" step="0.01" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Largura do Corpo</span><span id="val-width">1.00</span></div>
                <input type="range" id="slider-width" min="0.6" max="1.5" step="0.01" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Cabeça</span><span id="val-head">1.00</span></div>
                <input type="range" id="slider-head" min="0.7" max="1.4" step="0.01" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Seios</span><span id="val-breast">1.00</span></div>
                <input type="range" id="slider-breast" min="0.5" max="2.0" step="0.05" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Quadril</span><span id="val-hip">1.00</span></div>
                <input type="range" id="slider-hip" min="0.7" max="1.5" step="0.01" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Braços</span><span id="val-arm">1.00</span></div>
                <input type="range" id="slider-arm" min="0.6" max="1.8" step="0.01" value="1.00">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>Pernas</span><span id="val-leg">1.00</span></div>
                <input type="range" id="slider-leg" min="0.6" max="1.8" step="0.01" value="1.00">
            </div>

            <button class="action-btn reset" id="btn-reset" type="button">
                <i class="fas fa-undo"></i> Resetar Tudo
            </button>
        </div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" placeholder="Fale com a Livia..." id="chat-input">
            <button class="chat-send" id="chat-send" type="button"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="error-box"></div>

    <script>
        // ==========================================
        // TRATAMENTO DE ERRO
        // ==========================================
        window.addEventListener('error', function(e) {
            const box = document.getElementById('error-box');
            if (box) {
                box.style.display = 'block';
                box.textContent = '⚠️ ' + (e.message || 'Erro desconhecido');
                setTimeout(() => box.style.display = 'none', 5000);
            }
        });

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            
            console.log('✅ App iniciado');

            function showToast(msg) {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ==========================================
            // MENU
            // ==========================================
            const menuToggle = document.getElementById('menu-toggle');
            const sidePanel = document.getElementById('side-panel');
            const closeBtn = document.getElementById('close-btn');

            menuToggle.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                sidePanel.classList.toggle('open');
                menuToggle.classList.toggle('active');
            });

            closeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                sidePanel.classList.remove('open');
                menuToggle.classList.remove('active');
            });

            // ==========================================
            // PROCESSAR IMAGEM
            // ==========================================
            function processImage(file, targetW, targetH, callback) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = targetW;
                            canvas.height = targetH;
                            const ctx = canvas.getContext('2d');

                            const scaleX = targetW / img.width;
                            const scaleY = targetH / img.height;
                            const scale = Math.max(scaleX, scaleY);

                            const newW = img.width * scale;
                            const newH = img.height * scale;
                            const dx = (targetW - newW) / 2;
                            const dy = (targetH - newH) / 2;

                            ctx.drawImage(img, dx, dy, newW, newH);
                            const dataURL = canvas.toDataURL('image/jpeg', 0.85);
                            callback(dataURL);
                        } catch (err) {
                            console.error(err);
                            showToast('❌ Erro ao processar imagem');
                        }
                    };
                    img.onerror = function() { showToast('❌ Erro ao carregar imagem'); };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            // ==========================================
            // MUDAR CORPO
            // ==========================================
            const bodyPhotoInput = document.getElementById('body-photo-input');
            const bodyPhoto = document.getElementById('body-photo');
            const btnRemoveBody = document.getElementById('btn-remove-body');

            document.getElementById('btn-change-body').addEventListener('click', function() {
                bodyPhotoInput.click();
            });

            bodyPhotoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                showToast('⏳ Processando corpo...');
                processImage(file, 250, 500, function(dataURL) {
                    try {
                        localStorage.setItem('livia-body-photo', dataURL);
                        applyBodyPhoto(dataURL);
                        showToast('✅ Corpo atualizado!');
                    } catch (err) {
                        showToast('❌ Foto muito grande');
                    }
                });
            });

            function applyBodyPhoto(dataURL) {
                bodyPhoto.setAttributeNS('http://www.w3.org/1999/xlink', 'href', dataURL);
                bodyPhoto.setAttribute('href', dataURL);
                bodyPhoto.style.display = 'block';
                btnRemoveBody.style.display = 'flex';
                hideBodyParts(true);
            }

            function hideBodyParts(hide) {
                ['left-leg', 'right-leg', 'hip-group', 'torso-group', 'breasts-group', 'left-arm', 'right-arm'].forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) el.style.opacity = hide ? '0' : '1';
                });
            }

            btnRemoveBody.addEventListener('click', function() {
                localStorage.removeItem('livia-body-photo');
                bodyPhoto.style.display = 'none';
                btnRemoveBody.style.display = 'none';
                hideBodyParts(false);
                showToast('🗑️ Corpo removido');
            });

            // Carrega corpo salvo
            try {
                const savedBody = localStorage.getItem('livia-body-photo');
                if (savedBody) applyBodyPhoto(savedBody);
            } catch (e) { console.error(e); }

            // ==========================================
            // SLIDERS
            // ==========================================
            const characterGroup = document.getElementById('character-group');
            const state = { height: 1, width: 1 };

            function applyTransforms() {
                characterGroup.setAttribute('transform', 
                    'translate(150 300) scale(' + state.width + ' ' + state.height + ') translate(-150 -300)');
            }

            document.getElementById('slider-height').addEventListener('input', function(e) {
                state.height = parseFloat(e.target.value);
                document.getElementById('val-height').textContent = state.height.toFixed(2);
                applyTransforms();
            });

            document.getElementById('slider-width').addEventListener('input', function(e) {
                state.width = parseFloat(e.target.value);
                document.getElementById('val-width').textContent = state.width.toFixed(2);
                applyTransforms();
            });

            document.getElementById('slider-head').addEventListener('input', function(e) {
                const v = parseFloat(e.target.value);
                document.getElementById('val-head').textContent = v.toFixed(2);
                const el = document.getElementById('head-group');
                el.style.transform = 'scale(' + v + ')';
                el.style.transformOrigin = '150px 190px';
            });

            document.getElementById('slider-breast').addEventListener('input', function(e) {
                const v = parseFloat(e.target.value);
                document.getElementById('val-breast').textContent = v.toFixed(2);
                const el = document.getElementById('breasts-group');
                el.style.transform = 'scale(' + v + ')';
                el.style.transformOrigin = '150px 250px';
            });

            document.getElementById('slider-hip').addEventListener('input', function(e) {
                const v = parseFloat(e.target.value);
                document.getElementById('val-hip').textContent = v.toFixed(2);
                const el = document.getElementById('hip-group');
                el.style.transform = 'scaleX(' + v + ')';
                el.style.transformOrigin = '150px 362px';
            });

            document.getElementById('slider-arm').addEventListener('input', function(e) {
                const v = parseFloat(e.target.value);
                document.getElementById('val-arm').textContent = v.toFixed(2);
                document.getElementById('left-arm').style.transform = 'scaleX(' + v + ')';
                document.getElementById('right-arm').style.transform = 'scaleX(' + v + ')';
            });

            document.getElementById('slider-leg').addEventListener('input', function(e) {
                const v = parseFloat(e.target.value);
                document.getElementById('val-leg').textContent = v.toFixed(2);
                document.getElementById('left-leg').style.transform = 'scaleX(' + v + ')';
                document.getElementById('right-leg').style.transform = 'scaleX(' + v + ')';
            });

            // ==========================================
            // RESET
            // ==========================================
            document.getElementById('btn-reset').addEventListener('click', function() {
                document.querySelectorAll('input[type="range"]').forEach(function(s) { s.value = 1; });
                document.querySelectorAll('[id^="val-"]').forEach(function(l) { l.textContent = '1.00'; });
                state.height = 1;
                state.width = 1;
                characterGroup.setAttribute('transform', '');
                ['head-group', 'breasts-group', 'hip-group', 'left-arm', 'right-arm', 'left-leg', 'right-leg'].forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) el.style.transform = '';
                });
                showToast('✅ Resetado!');
            });

            // ==========================================
            // DAR VIDA
            // ==========================================
            let isAlive = false;
            document.getElementById('btn-dar-vida').addEventListener('click', function() {
                isAlive = !isAlive;
                if (isAlive) {
                    this.classList.add('active');
                    this.innerHTML = '<i class="fas fa-heartbeat"></i> Vida Ativa';
                    showToast('💚 Livia está viva!');
                } else {
                    this.classList.remove('active');
                    this.innerHTML = '<i class="fas fa-heart"></i> Dar Vida';
                }
            });

            // ==========================================
            // CHAT
            // ==========================================
            const chatInput = document.getElementById('chat-input');
            const chatSend = document.getElementById('chat-send');

            function sendMessage() {
                const text = chatInput.value.trim();
                if (!text) return;
                chatInput.value = '';
                chatInput.placeholder = 'Livia está pensando...';
                setTimeout(function() {
                    const responses = ['Entendi!', 'Legal!', 'Interessante!', 'Me conta mais.', 'Hmm, faz sentido.'];
                    chatInput.placeholder = 'Livia: ' + responses[Math.floor(Math.random() * responses.length)];
                }, 1000);
            }

            chatSend.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // ==========================================
            // HINT
            // ==========================================
            setTimeout(function() {
                const hint = document.getElementById('hint');
                if (hint) hint.style.opacity = '0.3';
            }, 5000);

            showToast('👋 Bem-vindo!');
        });
    </script>
</body>
</html>
